[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SpatialCellChat-python"
version = "0.1.0"
description = "Python port of the R SpatialCellChat package — inference and analysis of cell-cell communication from spatial transcriptomics data."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "SpatialCellChat-python contributors" },
]
keywords = ["single-cell", "spatial-transcriptomics", "cell-cell-communication", "anndata", "scverse"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "scanpy>=1.9",
    "squidpy>=1.4",
    "pyarrow>=12",
    "h5py>=3",
    "python-igraph>=0.10",
    "leidenalg>=0.9",
    "networkx>=3.0",
    "umap-learn>=0.5",
    "sparse>=0.15",
    "esda>=2.5",
    "libpysal>=4.7",
    "geopandas>=1.0",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pycirclize>=1.0",
    "plotly>=5.0",
    "natsort>=8.0",
    "geosketch>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]", "mkdocs-material", "mkdocs-jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["spatialcellchat"]
exclude = ["**/.ipynb_checkpoints", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = ["spatialcellchat", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/.ipynb_checkpoints", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources._vendor.pyparsing",
    "ignore::DeprecationWarning:scanpy.tools._louvain",
    "ignore:Tensorflow not installed:ImportWarning",
    "ignore:Some eigenvector centralities are nearly zero:RuntimeWarning",
]
