id: spatialcellchat.spatialDimPlot
import_path: spatialcellchat.viz_spatial.spatialDimPlot
kind: function
signature: >-
  spatialDimPlot(adata: ad.AnnData, color_use: Optional[Sequence[str]] =
  None, group_by: Optional[str] = None, sources_use: Optional[Sequence] =
  None, targets_use: Optional[Sequence] = None, idents_use:
  Optional[Sequence] = None, proportion: Optional[pandas.DataFrame] = None,
  radius: Optional[float] = None, radius_size: float = 0.55, alpha: float =
  1.0, shape_by: Union[int, str] = "o", title_name: Optional[str] = None,
  point_size: float = 2.4, legend_size: float = 3.0, legend_text_size: int =
  8, legend_position: str = "right", legend_spacing: Sequence[float] =
  (0.0, -8.0), ncol: int = 1, byrow: bool = False, lib_id: str = "slice1",
  image_key: Optional[str] = "lowres") -> Figure
purpose: Static (matplotlib) spatial scatter of cell groups on the tissue image, either as colored points or as per-spot cell-type-proportion scatter pies.
description: >
  Mirrors R's spatialDimPlot (visualization.R:114). Coordinates come from
  adata.obsm["spatial"] via _xy_from_adata (raises ValueError if not a
  2-column matrix); group labels come from group_by (an adata.obs column)
  or, when group_by is None, from the first of "cellchat_idents" /
  "active_ident" / "cell.type" found in adata.obs (raises ValueError if none
  exist). idents_use / sources_use+targets_use recolor/relabel a subset of
  categories, bucketing everything else into "Others" (grey #E5E5E5),
  mirroring plotly_spatialDimPlot's semantics. The background tissue image
  and its scale factor are pulled via the internal _spatial_layer helper
  (keyed by lib_id/image_key); when an image is found, coordinates are
  rescaled by that factor and the y-axis is left in image (non-inverted)
  orientation; without an image the y-axis is inverted to match R's
  scale_y_reverse(). When proportion is given (a DataFrame of per-spot
  cell-type fractions, rows aligned to adata.obs_names), draws scatter pies
  via the internal _scatterpie_layer helper instead of single-color points;
  radius defaults to a CARD-style area heuristic
  (sqrt(bbox_area / n_spots / pi) * radius_size) when None.
parameters:
  - name: adata
    type: anndata.AnnData
    required: true
    default: null
    description: Object with obsm["spatial"], an obs group column (or default ident column), and optionally the scanpy/squidpy uns["spatial"] image block.
  - name: color_use
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Colour per cell group (or per cell type when proportion is given); falls back to scPalette.
  - name: group_by
    type: Optional[str]
    required: false
    default: null
    description: Column name in adata.obs with cell-group labels; defaults to the resolved ident column.
  - name: sources_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Group labels or 1-based indices recolored as "sources"; combined with targets_use into an Others-bucketed category.
  - name: targets_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Group labels or 1-based indices recolored as "targets".
  - name: idents_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict/relabel the color categories to this subset (everything else becomes "Others").
  - name: proportion
    type: Optional[pandas.DataFrame]
    required: false
    default: null
    description: Per-spot cell-type proportions (rows match adata.obs_names, columns are cell types). When given, draws scatter pies instead of points.
  - name: radius
    type: Optional[float]
    required: false
    default: null
    description: Per-pie radius (data units); None triggers the area-based heuristic.
  - name: radius_size
    type: float
    required: false
    default: 0.55
    description: Scale factor applied to the heuristic pie radius.
  - name: alpha
    type: float
    required: false
    default: 1.0
    description: Per-spot marker opacity (point mode only).
  - name: shape_by
    type: Union[int, str]
    required: false
    default: o
    description: Matplotlib marker style for point mode.
  - name: title_name
    type: Optional[str]
    required: false
    default: null
    description: Figure title.
  - name: point_size
    type: float
    required: false
    default: 2.4
    description: Marker size scale (rendered as point_size**2 * 6 in scatter units).
  - name: legend_size
    type: float
    required: false
    default: 3.0
    description: Legend marker scale (point mode only).
  - name: legend_text_size
    type: int
    required: false
    default: 8
    description: Legend font size.
  - name: legend_position
    type: str
    required: false
    default: right
    description: Matplotlib legend loc string.
  - name: legend_spacing
    type: Sequence[float]
    required: false
    default: (0.0, -8.0)
    description: (x, y) legend key spacing hint (kept for R-argument parity).
  - name: ncol
    type: int
    required: false
    default: 1
    description: Number of legend columns.
  - name: byrow
    type: bool
    required: false
    default: false
    description: Legend fill order hint (kept for R-argument parity).
  - name: lib_id
    type: str
    required: false
    default: slice1
    description: Key into uns["spatial"] selecting the background tissue image/scale factors.
  - name: image_key
    type: Optional[str]
    required: false
    default: lowres
    description: Which image resolution to draw as background ("lowres"/"hires"), or None to skip the image entirely.
returns: A new matplotlib.figure.Figure with a single axis containing either a colored spot scatter with a legend, or per-spot scatter pies with a cell-type legend.
mutates: >-
  execution_class=pure_function; reads adata.obsm["spatial"], adata.obs, and
  uns["spatial"][lib_id] (via _spatial_layer); does not mutate adata;
  returns_kind=new_object
requires:
  - obsm.spatial
writes: []
examples:
  - 'scc.spatialDimPlot(adata, proportion=ctd, point_size=1.5, image_key=None)'
  - 'scc.spatialDimPlot(adata, group_by="SecretedHotspot", point_size=1.5, color_use=["#ff0000", "#00ff00"])'
  - 'scc.spatialDimPlot(adata, idents_use=["A"])'
failure_fixes:
  - when: adata.obsm["spatial"] is not a 2-column matrix
    suggest:
      - Ensure adata.obsm["spatial"] has exactly 2 columns (x, y).
    explanation: "_xy_from_adata raises ValueError(\"adata.obsm['spatial'] must be a 2-column (x, y) matrix.\")."
  - when: group_by is None and none of "cellchat_idents"/"active_ident"/"cell.type" exist in adata.obs
    suggest:
      - Pass group_by= naming an existing adata.obs column, or add one of the default ident columns.
    explanation: "_idents_from_adata raises ValueError(\"adata.obs has no 'cellchat_idents' / 'active_ident' / 'cell.type' column; please pass group_by.\")."
  - when: image_key is set explicitly but that key is missing from uns["spatial"][lib_id]["images"]
    suggest:
      - Pass an image_key that exists in uns["spatial"][lib_id]["images"], or image_key=None to skip the background image.
    explanation: The internal _spatial_layer helper raises KeyError listing the available image keys (strict mode).
related:
  - spatialcellchat.plotly_spatialDimPlot
  - spatialcellchat.spatialGiPlot
