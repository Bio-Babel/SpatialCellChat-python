    description: "(nC, nTypes) cell-type proportion matrix. If a DataFrame, column names must match the levels of the resolved group factor and row names must match adata.obs_names exactly; if a plain ndarray, its shape must be (adata.n_obs, n_clusters) (matching the number of group levels)."
  - name: avg_type
    type: "Literal['avg', 'sum']"
