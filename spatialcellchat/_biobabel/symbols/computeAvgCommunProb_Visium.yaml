failure_fixes:
  - when: 'RuntimeError: Please run `computeCommunProb` ...'
    suggest:
      - call spatialcellchat.computeCommunProb(adata, ...) first so it populates uns['cellchat']['net']['tmp']['prob.cell'].
  - when: 'ValueError: cell groups'' names'
    suggest:
      - make cell_type_decomposition's DataFrame columns exactly match the group_by/active_ident factor's categories (same names, order does not matter but membership must).
  - when: 'ValueError: cells'' names'
    suggest:
      - make cell_type_decomposition's DataFrame row index exactly match adata.obs_names (same cells, same order).
  - when: 'ValueError: expected N columns'
    suggest:
      - when passing a plain ndarray, its column count must equal the number of group levels; reshape or subset cell_type_decomposition accordingly.
  - when: 'ValueError: avg_type must be one of ''avg'', ''sum'''
    suggest:
      - pass avg_type='avg' or avg_type='sum'.
  - when: 'ValueError: Each LR pair does not have any spot-level links/interactions'
    suggest:
      - every LR's prob.cell matrix is all-zero; rerun computeCommunProb with looser filtering or check the input expression data.
