kind: function
signature: "computeAvgCommunProb_Visium(adata: ad.AnnData, cell_type_decomposition: Union[np.ndarray, pd.DataFrame], avg_type: Literal['avg', 'sum'] = 'avg', group_by: Optional[str] = None, do_permutation: bool = True, nboot: int = 100, seed_use: int = 1, colocalization_use: bool = False, thresh_colo: float = 0.05) -> ad.AnnData"
purpose: Compute group-level (cell-type-level) communication for low-resolution Visium spatial data using cell-type decomposition proportions.
description: >
  Mirrors R's computeAvgCommunProb_Visium (modeling.R:603). Used for
  low-resolution spot-based platforms such as 10X Visium, where each spot
  is a mixture of multiple cell types rather than a single cell; for
  high-resolution platforms (Slide-seqV2, Stereo-seq, MERFISH) use
  computeAvgCommunProb instead (per the package tutorial).

  Differs from computeAvgCommunProb in that the per-spot aggregation uses a
  *cell-type decomposition* matrix (rows are spots, columns are cell types,
  entries are proportions summing to ~1 per spot) instead of a hard
  per-cell group assignment. Validates that cell_type_decomposition's
  columns match the resolved group factor's levels and (if a DataFrame)
  that its row index matches adata.obs_names exactly, or (if a plain
  ndarray) that its shape matches (n_obs, n_clusters).

  Reads the precomputed per-LR sparse cell-cell (spot-cell) probability
  matrices from adata.uns['cellchat']['net']['tmp']['prob.cell']. For each
  LR pair with at least one nonzero spot-level link, dispatches to
  computeAvgCommunProb_LR_Visium_Avg (avg_type="avg") or
  computeAvgCommunProb_LR_Visium_Sum (avg_type="sum") to aggregate to a
  (nTypes, nTypes) cell-type-level matrix, optionally zeroing out
  colocalization-failing pairs (colocalization_use=True). Permutation
  testing (do_permutation=True) shuffles the *columns* (cell-type identity)
  of the decomposition matrix across nboot draws (rather than shuffling
  per-cell group labels as computeAvgCommunProb does) to build an empirical
  null and compute p-values, forcing p=1 wherever prob==0.

  Writes the aggregated probability array, permutation p-values, LR
  diagnostic counts, dimnames, the decomposition matrix itself, and the
  call's parameters back into adata.uns['cellchat']; mutates and returns
  the same AnnData object.
