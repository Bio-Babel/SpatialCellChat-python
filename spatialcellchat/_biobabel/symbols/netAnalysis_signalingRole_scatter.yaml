id: spatialcellchat.netAnalysis_signalingRole_scatter
import_path: spatialcellchat.viz_embedding.netAnalysis_signalingRole_scatter
kind: function
signature: >-
  netAnalysis_signalingRole_scatter(adata: ad.AnnData, signaling:
  Optional[Sequence[str]] = None, color_use: Optional[Sequence[str]] =
  None, slot_name: str = "netP", group: Optional[Sequence[str]] = None,
  weight_MinMax: Optional[Tuple[float, float]] = None, dot_size:
  Tuple[float, float] = (2.0, 6.0), point_shape: Sequence[str] = ("o", "s",
  "^", "D", "v", "P", "X"), label_size: float = 3.0, dot_alpha: float =
  0.6, x_measure: str = "outdeg", y_measure: str = "indeg", xlabel: str =
  "Outgoing interaction strength", ylabel: str = "Incoming interaction
  strength", title: Optional[str] = None, font_size: float = 10.0,
  font_size_title: float = 10.0, do_label: bool = True, show_legend: bool =
  True, show_axes: bool = True) -> Figure
purpose: Single-dataset scatter of dominant senders/receivers — one point per cell group, x/y = summed outgoing/incoming interaction strength, size = total number of significant links.
description: >
  Direct port of R's netAnalysis_signalingRole_scatter (analysis.R:2642).
  Reads adata.uns['cellchat'][slot_name]['centr'], raising ValueError
  (mentioning netAnalysis_computeCentrality) if absent or falsy, and
  raising ValueError if x_measure/y_measure are not among centr's
  centr_names. Extracts the outgoing (x_measure) and incoming (y_measure)
  centrality matrices (measure x cell x pathway), optionally restricts to
  `signaling` pathways (raising ValueError with "no significant
  communication for the input signaling" if the intersection is empty),
  and sums each over pathways to get one outgoing/incoming value per cell
  group. Point size encodes num_link, the per-cell-group total link count
  computed by internally calling aggregateNet(adata, signaling=signaling,
  return_object=False, remove_isolate=False) and summing its count
  matrix's row+col minus the diagonal; sizing is normalised against
  weight_MinMax when given, else against the observed num_link min/max.
  color_use defaults to scPalette(len(node_names)); when `group` is given,
  marker shape is drawn from point_shape per group level. Labels (cell
  group names) are drawn via repel_text when do_label=True.
parameters:
  - name: adata
    type: anndata.AnnData
    required: true
    default: null
    description: AnnData with adata.uns['cellchat'][slot_name]['centr'] populated (written by netAnalysis_computeCentrality) and adata.uns['cellchat']['net'] populated (read internally by aggregateNet for the point-size link counts).
  - name: signaling
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Restrict the centrality sums (and the internal aggregateNet call) to these pathways; raises ValueError if none are found among the significant pathways.
  - name: color_use
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Per-cell-group palette; defaults to scPalette(len(node_names)) when None.
  - name: slot_name
    type: str
    required: false
    default: netP
    description: Chat slot whose ['centr'] centrality output is read.
  - name: group
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Optional per-cell-group category labels; when given, drives per-point marker shape via point_shape.
  - name: weight_MinMax
    type: Optional[Tuple[float, float]]
    required: false
    default: null
    description: Explicit (min, max) range for scaling point size by num_link; defaults to the observed num_link min/max when None.
  - name: dot_size
    type: Tuple[float, float]
    required: false
    default: [2.0, 6.0]
    description: (min, max) marker-size range mapped from normalised num_link.
  - name: point_shape
    type: Sequence[str]
    required: false
    default: ["o", "s", "^", "D", "v", "P", "X"]
    description: Marker cycle used per unique `group` level when group is given.
  - name: label_size
    type: float
    required: false
    default: 3.0
    description: Base font size multiplier for repelled cell-group labels.
  - name: dot_alpha
    type: float
    required: false
    default: 0.6
    description: Marker face alpha.
  - name: x_measure
    type: str
    required: false
    default: outdeg
    description: Centrality measure name for the outgoing/x axis; must be present in centr_names.
  - name: y_measure
    type: str
    required: false
    default: indeg
    description: Centrality measure name for the incoming/y axis; must be present in centr_names.
  - name: xlabel
    type: str
    required: false
    default: Outgoing interaction strength
    description: X-axis label.
  - name: ylabel
    type: str
    required: false
    default: Incoming interaction strength
    description: Y-axis label.
  - name: title
    type: Optional[str]
    required: false
    default: null
    description: Optional plot title; no title is drawn when None.
  - name: font_size
    type: float
    required: false
    default: 10.0
    description: Axis label font size.
  - name: font_size_title
    type: float
    required: false
    default: 10.0
    description: Title font size.
  - name: do_label
    type: bool
    required: false
    default: true
    description: Whether to draw repelled cell-group-name labels.
  - name: show_legend
    type: bool
    required: false
    default: true
    description: Whether to draw the legend.
  - name: show_axes
    type: bool
    required: false
    default: true
    description: When False, turns off the axes frame/ticks entirely.
returns: A matplotlib.figure.Figure with a single scatter Axes, one point per cell group.
mutates: >-
  execution_class=pure_function; reads adata.uns['cellchat'][slot_name]
  and (via the internal aggregateNet(..., return_object=False) call)
  adata.uns['cellchat']['net'] only, does not mutate adata;
  returns_kind=new_object
requires:
  - uns.cellchat.netP.centr
writes: []
examples:
  - "scc.netAnalysis_signalingRole_scatter(adata)"
  - "scc.netAnalysis_signalingRole_scatter(adata, signaling=['TGFb', 'WNT'])"
  - "scc.netAnalysis_signalingRole_scatter(adata, weight_MinMax=(0.0, 10.0), color_use=['#1f77b4', '#ff7f0e', '#2ca02c'])"
failure_fixes:
  - when: "adata.uns['cellchat'][slot_name]['centr'] is missing"
    suggest:
      - "Run netAnalysis_computeCentrality() first."
    explanation: >-
      Raises ValueError("Please run `netAnalysis_computeCentrality` to
      compute the network centrality scores!") (checked in
      test_signalingRole_scatter_missing_centr_raises).
  - when: "x_measure or y_measure is not one of centr['centr_names']"
    suggest:
      - "Use a measure key written by netAnalysis_computeCentrality (e.g. 'outdeg', 'indeg', 'flowbet', 'info')."
    explanation: >-
      Raises ValueError(f"x.measure / y.measure must be one of
      {centr_names!r}") (checked in
      test_signalingRole_scatter_invalid_measure_raises).
  - when: "signaling is given but none of the pathways are found"
    suggest:
      - "Check the pathway names against centr['signaling_names']."
    explanation: >-
      Raises ValueError("There is no significant communication for the input
      signaling.") (checked in
      test_signalingRole_scatter_signaling_unknown_raises).
related:
  - spatialcellchat.netAnalysis_computeCentrality
  - spatialcellchat.aggregateNet
  - spatialcellchat.netAnalysis_diff_signalingRole_scatter
