purpose: Compute per-group AVERAGE of communication probabilities for one ligand-receptor pair.
description: >
  Pure-array helper (R: computeAvgCommunProb_LR_Avg, modeling.R:1318) used
  internally by computeAvgCommunProb's per-LR loop for avg_type="avg".
  Identical setup to computeAvgCommunProb_LR_Sum (one-hot group matrix,
  per-group expression filter via format(x, digits=1) >= min_percent, and
  per-group sender/receiver cell-count filter via the binarised prob matrix
  >= min_cells_sr), but the per-group SUM of prob is additionally divided
  element-wise by the per-group communication LINK COUNT (the same
  crossprod computed against the binarised prob matrix), turning the sum
  into an average. NaN entries from zero-by-zero division are replaced by
  0. If the expression filter zeroes out every (sender, receiver) pair, the
  function short-circuits and returns the all-zero mask directly. Does not
  read or write adata/uns state; operates purely on its array arguments.
