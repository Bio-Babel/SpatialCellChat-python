id: spatialcellchat.computeExprGroup_agonist
import_path: spatialcellchat._expr.computeExprGroup_agonist
kind: function
signature: "computeExprGroup_agonist(data_use: ArrayLike, pairLRsig: pd.DataFrame, cofactor_input: pd.DataFrame, group: Union[Sequence, pd.Categorical], index_agonist: int, Kh: float, FunMean: Callable[[np.ndarray], float], n: float) -> np.ndarray"
purpose: "Hill-aggregated per-cell-group agonist factor for one L-R pair; a port of computeExprGroup_agonist (modeling.R:2425)."
description: >
  Equivalent to computeExpr_agonist but applied to the per-group averaged
  expression matrix instead of raw per-cell expression: resolves the
  agonist's cofactor subunit genes present in data_use, aggregates each
  resolved gene's expression per group via FunMean (mirroring R's
  aggregate(t(data_use[...]), list(group), FUN=FunMean)), then applies the
  activating Hill kernel 1 + x^n / (Kh^n + x^n) per group (product across
  cofactors when more than one is resolved). Zero resolved cofactors
  yields an all-ones row over the present groups. Delegates to the shared
  `_hill_cofactor_group_one` helper (also used by
  computeExprGroup_antagonist).
parameters:
  - name: data_use
    type: Union[numpy.ndarray, pandas.DataFrame]
    required: true
    default: null
    description: Genes-by-cells expression matrix (row-named).
  - name: pairLRsig
    type: pandas.DataFrame
    required: true
    default: null
    description: L-R interaction table; the `agonist` column references cofactor_input's row index.
  - name: cofactor_input
    type: pandas.DataFrame
    required: true
    default: null
    description: CellChatDB cofactor table.
  - name: group
    type: Union[Sequence, pandas.Categorical]
    required: true
    default: null
    description: Per-cell group labels; coerced to pandas.Categorical if not already one.
  - name: index_agonist
    type: int
    required: true
    default: null
    description: 0-based row index into pairLRsig.
  - name: Kh
    type: float
    required: true
    default: null
    description: Hill EC50 parameter.
  - name: FunMean
    type: Callable[[numpy.ndarray], float]
    required: true
    default: null
    description: Per-group reduction function (e.g. the callable returned by _make_FunMean).
  - name: n
    type: float
    required: true
    default: null
    description: Hill coefficient.
returns: >
  A numpy.ndarray of shape (1, n_groups_present): the per-group agonist
  multiplier.
mutates: "execution_class=pure_function; no in-place mutation of `data_use`, `pairLRsig`, `cofactor_input`, or `group`; returns_kind=new_object"
requires: []
writes: []
examples:
  - "computeExprGroup_agonist(data_use, pairLRsig, cofactor_input, group=group, index_agonist=0, Kh=0.5, FunMean=FunMean, n=1)"
failure_fixes:
  - when: 'ValueError: _hill_cofactor_group_one requires a row-named data_use'
    suggest:
      - pass data_use as a pandas.DataFrame indexed by gene symbol.
related:
  - spatialcellchat.computeCommunProb
