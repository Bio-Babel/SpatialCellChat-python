id: spatialcellchat.netVisual_embeddingPairwise
import_path: spatialcellchat.viz_embedding.netVisual_embeddingPairwise
kind: function
signature: >-
  netVisual_embeddingPairwise(adata: ad.AnnData, slot_name: str = "netP",
  type_: str = "functional", comparison: Optional[Sequence[int]] = None,
  color_use: Optional[Sequence[str]] = None, point_shape:
  Optional[Sequence[str]] = None, pathway_labeled: Optional[Sequence[str]]
  = None, top_label: float = 1.0, pathway_remove: Optional[Sequence[str]] =
  None, pathway_remove_show: bool = True, dot_size: Tuple[float, float] =
  (2.0, 6.0), label_size: float = 2.5, dot_alpha: float = 0.5, xlabel: str
  = "Dim 1", ylabel: str = "Dim 2", title: Optional[str] = None, do_label:
  bool = True, show_legend: bool = True, show_axes: bool = True) -> Figure
purpose: Joint 2-D manifold scatter of signaling pathways from a multi-dataset comparison stored within a single AnnData, coloured by cluster and shaped by dataset/group.
description: >-
  IMPORTANT: despite the "Pairwise" name suggesting a list of datasets,
  this function's first parameter is a single `adata: ad.AnnData` (unlike
  netAnalysis_diff_signalingRole_scatter / netAnalysis_signalingChanges_scatter,
  which do take Sequence[AnnData]). The multi-dataset comparison is instead
  addressed by `comparison` (1-based dataset indices, default (1,) i.e. a
  single "dataset") which is joined into a `comparison_name` string (e.g.
  "1" or "1-2") used to look up a specific pre-merged similarity slot: R's
  mergeCellChat is expected to have already combined the datasets' netP
  similarity results into one AnnData's
  uns['cellchat'][slot_name]['similarity'][type_]['dr'][comparison_name]
  and ['group'][comparison_name] (via _build_embedding_df, same helper as
  netVisual_embedding/ZoomIn, with the same missing-similarity /
  missing-dr / missing-group ValueError messages referencing
  computeNetSimilarity / netEmbedding / netClustering). The resulting frame
  is annotated with a "group" column (defaulting to "1" when absent) that
  distinguishes which original dataset each pathway point came from; color
  encodes cluster (from color_use or ggPalette) and marker shape encodes
  the "group" value (from point_shape), per R's geom_point(aes(fill=clusters,
  colour=clusters, shape=group)). Isolate pathways are auto-detected from
  the similarity matrix and annotated as "Isolate pathways: ..." text when
  pathway_remove_show=True. Labels are drawn for pathway_labeled (or all
  points when None) via repel_text.
parameters:
  - name: adata
    type: anndata.AnnData
    required: true
    default: null
    description: Single AnnData whose adata.uns['cellchat'][slot_name]['similarity'][type_]['dr'][comparison_name] and ['group'][comparison_name] are populated for the requested comparison_name (built from `comparison`).
  - name: slot_name
    type: str
    required: false
    default: netP
    description: Chat slot whose ['similarity'] sub-dict is read.
  - name: type_
    type: str
    required: false
    default: functional
    description: Similarity type key ("functional" or "structural"); not validated directly, an unrecognised key surfaces as a missing-similarity ValueError.
  - name: comparison
    type: Optional[Sequence[int]]
    required: false
    default: null
    description: 1-based dataset indices joined with "-" to form comparison_name (e.g. [1] -> "1", [1, 2] -> "1-2"); defaults to (1,) when None.
  - name: color_use
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Per-cluster colour palette; defaults to ggPalette(len(cluster_ids)) when None.
  - name: point_shape
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Marker cycle mapped to unique "group" (dataset) values; defaults to ["o","s","^","D","v","P","X"] when None.
  - name: pathway_labeled
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Restrict repelled text labels to this pathway subset; all points are labelled when None (and do_label=True).
  - name: top_label
    type: float
    required: false
    default: 1.0
    description: Reserved for R parity; no effect in this implementation.
  - name: pathway_remove
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Explicit isolate-pathway list to annotate; auto-detected from the similarity matrix when None.
  - name: pathway_remove_show
    type: bool
    required: false
    default: true
    description: 'When True and pathway_remove is nonempty, draws an "Isolate pathways: ..." text annotation.'
  - name: dot_size
    type: Tuple[float, float]
    required: false
    default: [2.0, 6.0]
    description: (min, max) marker-size range mapped from normalised communication probability.
  - name: label_size
    type: float
    required: false
    default: 2.5
    description: Base font size multiplier for repelled pathway labels and the isolate-pathway annotation.
  - name: dot_alpha
    type: float
    required: false
    default: 0.5
    description: Marker face alpha.
  - name: xlabel
    type: str
    required: false
    default: Dim 1
    description: X-axis label.
  - name: ylabel
    type: str
    required: false
    default: Dim 2
    description: Y-axis label.
  - name: title
    type: Optional[str]
    required: false
    default: null
    description: Optional plot title; no title is drawn when None.
  - name: do_label
    type: bool
    required: false
    default: true
    description: Whether to draw repelled pathway-name labels.
  - name: show_legend
    type: bool
    required: false
    default: true
    description: Whether to draw the cluster/dataset legend.
  - name: show_axes
    type: bool
    required: false
    default: true
    description: When False, turns off the axes frame/ticks entirely.
returns: A matplotlib.figure.Figure with a single scatter Axes, one point per (pathway, dataset) combination in the joint embedding.
mutates: >-
  execution_class=pure_function; reads adata.uns['cellchat'][slot_name]
  only, does not mutate adata; returns_kind=new_object
requires:
  - uns.cellchat.netP.similarity.functional.dr.<comparison_name>
  - uns.cellchat.netP.similarity.functional.group.<comparison_name>
writes: []
examples:
  - "scc.netVisual_embeddingPairwise(adata, type_='functional', comparison=[1])"
  - "scc.netVisual_embeddingPairwise(adata, type_='functional', comparison=[1], pathway_remove=['ISOLATE_PW'], pathway_remove_show=True)"
failure_fixes:
  - when: "adata.uns['cellchat'] is missing"
    suggest:
      - "Run the CellChat pipeline (computeCommunProb etc.) first to populate adata.uns['cellchat']."
    explanation: "Raises ValueError(\"adata.uns['cellchat'] is missing.\") from _ensure_cellchat."
  - when: "similarity[type_] is missing"
    suggest:
      - "Run computeNetSimilarity(adata, type_='functional') (or 'structural') first."
    explanation: "Raises ValueError(f\"similarity[{type_!r}] missing; run computeNetSimilarity.\")."
  - when: "similarity[type_]['dr'][comparison_name] is missing"
    suggest:
      - "Run netEmbedding() for this comparison after computeNetSimilarity()."
    explanation: "Raises ValueError mentioning \"run netEmbedding\" for the given comparison_name."
  - when: "similarity[type_]['group'][comparison_name] is missing"
    suggest:
      - "Run netClustering() for this comparison after netEmbedding()."
    explanation: "Raises ValueError mentioning \"run netClustering\" for the given comparison_name."
related:
  - spatialcellchat.computeNetSimilarity
  - spatialcellchat.netEmbedding
  - spatialcellchat.netClustering
  - spatialcellchat.netVisual_embedding
  - spatialcellchat.netVisual_embeddingPairwiseZoomIn
