id: spatialcellchat.netVisual
import_path: spatialcellchat.viz_network.netVisual
kind: function
signature: >-
  netVisual(adata: ad.AnnData, signaling: str, signaling_name:
  Optional[str] = None, color_use: Optional[Sequence[str]] = None,
  vertex_receiver: Optional[Sequence[int]] = None, sources_use:
  Optional[Sequence] = None, targets_use: Optional[Sequence] = None, top:
  float = 1.0, remove_isolate: bool = False, vertex_weight: Union[float,
  Sequence[float]] = 1.0, vertex_weight_max: Optional[float] = None,
  vertex_size_max: Optional[float] = None, weight_scale: bool = True,
  edge_weight_max_individual: Optional[float] = None,
  edge_weight_max_aggregate: Optional[float] = None, edge_width_max: float =
  8.0, layout: str = "circle", height: float = 5.0, thresh: float = 0.05,
  pt_title: float = 12.0, title_space: float = 6.0, vertex_label_cex: float =
  0.8, alpha_image: float = 0.15, point_size: float = 1.5, group:
  Optional[Dict[str, str]] = None, cell_order: Optional[Sequence[str]] =
  None, small_gap: float = 1.0, big_gap: float = 10.0, scale: bool = False,
  reduce: float = -1.0, show_legend: bool = False, legend_pos_x: float =
  20.0, legend_pos_y: float = 20.0, n_col: Optional[int] = None, out_format:
  Optional[Union[str, Sequence[str]]] = None, out_dir: Optional[str] = None)
  -> Figure
purpose: Visualize the inferred cell-cell communication network for one signaling pathway, dispatching to a rendering layout.
description: >
  Direct port of R's netVisual (visualization.R:866). A thin dispatcher: it
  reads adata.uns['cellchat']['net']['prob']/['pval']/['dimnames'] and
  adata.uns['cellchat']['LR']['LRsig'] once (via the internal
  _resolve_signaling helper) to build the per-L-R-pair and pathway-summed
  probability matrices for `signaling`, then routes to the matching
  layout's raw-matrix renderer with the aggregate ("prob_sum") matrix (and,
  when out_format+out_dir are given, additionally renders and writes one
  file per surviving L-R pair plus the aggregate, per requested format):
  layout="circle" -> netVisual_circle; "hierarchy" -> the internal
  _hierarchy_combined helper (requires vertex_receiver, raises otherwise);
  "spatial" -> netVisual_spatial (reads adata.obsm['spatial'] and, when
  vertex_weight is "incoming"/"outgoing", adata.uns['cellchat']['netP']['centr']);
  "chord" -> netVisual_chord_cell_internal; "heatmap" -> viz_heatmap.netVisual_heatmap
  (a convenience routing not present in R's own layout list). Unlike
  netVisual_aggregate/netVisual_individual, per-pair figures for the
  disk-writing branch (out_format/out_dir) are closed after saving, not
  returned. Reads adata.uns['cellchat'] only; does not mutate adata.
parameters:
  - name: adata
    type: anndata.AnnData
    required: true
    default: null
    description: Object with uns['cellchat']['net']['prob'] and uns['cellchat']['LR']['LRsig'] populated.
  - name: signaling
    type: str
    required: true
    default: null
    description: Pathway name to look up in the LR table's pathway_name column.
  - name: signaling_name
    type: Optional[str]
    required: false
    default: null
    description: Display name for the pathway in titles; defaults to signaling.
  - name: color_use
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Per-cell-group colours forwarded to the chosen layout's renderer.
  - name: vertex_receiver
    type: Optional[Sequence[int]]
    required: false
    default: null
    description: 0-based target-group indices; required when layout="hierarchy" (raises otherwise).
  - name: sources_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to these source cell groups.
  - name: targets_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to these target cell groups.
  - name: top
    type: float
    required: false
    default: 1.0
    description: Keep only edge weights >= the (1-top) quantile; forwarded to the layout renderer.
  - name: remove_isolate
    type: bool
    required: false
    default: false
    description: Drop cell groups with no surviving edges.
  - name: vertex_weight
    type: Union[float, Sequence[float]]
    required: false
    default: 1.0
    description: Per-group vertex size driver; None defaults to per-group cell counts. "incoming"/"outgoing" (layout="spatial" only) resolves a centrality vector from uns['cellchat']['netP']['centr'].
  - name: vertex_weight_max
    type: Optional[float]
    required: false
    default: null
    description: Normalisation max for vertex_weight.
  - name: vertex_size_max
    type: Optional[float]
    required: false
    default: null
    description: Max vertex marker scale factor; auto-selected as 5.0 for uniform vertex_weight, else 15.0, when None.
  - name: weight_scale
    type: bool
    required: false
    default: true
    description: Scale edge width by weight/edge_weight_max instead of weight directly.
  - name: edge_weight_max_individual
    type: Optional[float]
    required: false
    default: null
    description: Edge-width normalisation max for per-L-R-pair panels; defaults to the max per-pair probability.
  - name: edge_weight_max_aggregate
    type: Optional[float]
    required: false
    default: null
    description: Edge-width normalisation max for the pathway-aggregate panel; defaults to the max summed probability.
  - name: edge_width_max
    type: float
    required: false
    default: 8.0
    description: Maximum additional edge linewidth contribution.
  - name: layout
    type: str
    required: false
    default: circle
    description: 'One of "circle", "hierarchy", "spatial", "chord", "heatmap" (raises ValueError otherwise).'
  - name: height
    type: float
    required: false
    default: 5.0
    description: Per-panel figure height (inches) used when writing multi-panel files via out_format/out_dir.
  - name: thresh
    type: float
    required: false
    default: 0.05
    description: p-value threshold used when resolving the significant L-R pairs/pathway total.
  - name: pt_title
    type: float
    required: false
    default: 12.0
    description: Title font size (points).
  - name: title_space
    type: float
    required: false
    default: 6.0
    description: Vertical spacing reserved for the title.
  - name: vertex_label_cex
    type: float
    required: false
    default: 0.8
    description: Vertex label font-size scale forwarded to the layout renderer.
  - name: alpha_image
    type: float
    required: false
    default: 0.15
    description: Background image/spot opacity (layout="spatial" only).
  - name: point_size
    type: float
    required: false
    default: 1.5
    description: Background spot marker size (layout="spatial" only).
  - name: group
    type: Optional[Dict[str, str]]
    required: false
    default: null
    description: Cell-group -> higher-level group mapping forwarded to layout="chord".
  - name: cell_order
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Explicit sector display order forwarded to layout="chord".
  - name: small_gap
    type: float
    required: false
    default: 1.0
    description: Chord sector gap (degrees), layout="chord" only.
  - name: big_gap
    type: float
    required: false
    default: 10.0
    description: Chord wrap-around gap (degrees), layout="chord" only.
  - name: scale
    type: bool
    required: false
    default: false
    description: Row-normalise chord sector arc lengths, layout="chord" only.
  - name: reduce
    type: float
    required: false
    default: -1.0
    description: Chord minimum-link-width pruning threshold, layout="chord" only.
  - name: show_legend
    type: bool
    required: false
    default: false
    description: Draw a legend, layout="chord" only.
  - name: legend_pos_x
    type: float
    required: false
    default: 20.0
    description: Chord legend x offset.
  - name: legend_pos_y
    type: float
    required: false
    default: 20.0
    description: Chord legend y offset.
  - name: n_col
    type: Optional[int]
    required: false
    default: null
    description: Grid-layout column count for the out_format/out_dir per-pair file writer; defaults to min(#pairs, 2).
  - name: out_format
    type: Optional[Union[str, Sequence[str]]]
    required: false
    default: null
    description: When set together with out_dir, additionally writes per-pair-grid + aggregate files (per format) under out_dir.
  - name: out_dir
    type: Optional[str]
    required: false
    default: null
    description: Output directory for the out_format file-writing branch.
returns: >-
  A new matplotlib.figure.Figure (the pathway-aggregate panel) for the
  requested layout; layout="heatmap" delegates to viz_heatmap.netVisual_heatmap.
mutates: >-
  execution_class=pure_function; reads adata.uns['cellchat']['net'],
  ['LR']['LRsig'], adata.obsm['spatial'] (layout="spatial"), and
  ['netP']['centr'] (layout="spatial" with vertex_weight="incoming"/"outgoing")
  only; does not mutate adata; may write files to out_dir as a side effect
  when out_format/out_dir are both given; returns_kind=new_object
requires:
  - uns.cellchat.net.prob
  - uns.cellchat.LR.LRsig
writes: []
examples:
  - "scc.netVisual(sub, signaling='TNF', layout='circle')"
  - "scc.netVisual(sub, signaling='TNF', layout='hierarchy', vertex_receiver=[0, 1])"
  - "scc.netVisual(sub, signaling='TNF', layout='chord')"
failure_fixes:
  - when: "layout is not one of 'circle','hierarchy','spatial','chord','heatmap'"
    suggest:
      - "Pass one of the supported layout values."
    explanation: "Raises ValueError(f\"Unknown layout: {layout}\")."
  - when: "layout='hierarchy' but vertex_receiver is None"
    suggest:
      - "Pass vertex_receiver= (0-based target-group indices) when layout='hierarchy'."
    explanation: "Raises ValueError(\"vertex_receiver is required for hierarchy layout\")."
  - when: "layout='spatial' with vertex_weight in ('incoming','outgoing') but uns['cellchat']['netP']['centr'] is missing"
    suggest:
      - "Run netAnalysis_computeCentrality(adata, slot_name='netP', do_group=True) first."
    explanation: >-
      Raises ValueError("Please run `netAnalysis_computeCentrality` to
      compute the network centrality scores!").
  - when: "no significant L-R pair of `signaling` survives thresholding"
    suggest:
      - "Lower thresh, or verify the pathway via subsetCommunication."
    explanation: "Raises ValueError(f\"There is no significant communication of {signaling}\")."
related:
  - spatialcellchat.netVisual_aggregate
  - spatialcellchat.netVisual_individual
  - spatialcellchat.netVisual_circle
  - spatialcellchat.netVisual_spatial
  - spatialcellchat.netVisual_chord_cell_internal
  - spatialcellchat.netVisual_heatmap
