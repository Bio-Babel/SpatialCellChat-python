examples:
  - "scc.computeAvgCommunProb(adata, group_by='cellchat_idents', avg_type='avg', do_permutation=False)"
  - "scc.computeAvgCommunProb(adata, avg_type='sum', nboot=100, do_permutation=True, seed_use=1)"
failure_fixes:
  - when: 'RuntimeError: Please run `computeCommunProb` ...'
    suggest:
      - call spatialcellchat.computeCommunProb(adata, ...) first so it populates uns['cellchat']['net']['tmp']['prob.cell'].
  - when: 'RuntimeError: computeAvgCommunProb requires ... ''Lavg'' and ''Ravg'''
    suggest:
      - ensure computeCommunProb ran to completion and wrote uns['cellchat']['net']['tmp']['Lavg']/['Ravg'].
  - when: 'ValueError: ensure that the factor levels are correct'
    suggest:
      - drop unused categories from the group_by / active_ident column so its number of categories matches the number of levels actually present in the data (e.g. `adata.obs[col].cat.remove_unused_categories()`).
  - when: 'ValueError: avg_type must be one of ''avg'', ''sum'''
    suggest:
      - pass avg_type='avg' or avg_type='sum'.
  - when: 'ValueError: Each LR pair does not have any cell-level links/interactions'
    suggest:
      - every LR's prob.cell matrix is all-zero; rerun computeCommunProb with looser filtering or check the input expression data.
