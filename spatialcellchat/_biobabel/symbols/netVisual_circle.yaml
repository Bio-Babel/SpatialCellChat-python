id: spatialcellchat.netVisual_circle
import_path: spatialcellchat.viz_network.netVisual_circle
kind: function
signature: >-
  netVisual_circle(net: Union[np.ndarray, pd.DataFrame], color_use:
  Optional[Sequence[str]] = None, title_name: Optional[str] = None,
  sources_use: Optional[Sequence] = None, targets_use: Optional[Sequence] =
  None, idents_use: Optional[Sequence] = None, remove_isolate: bool = False,
  top: float = 1.0, weight_scale: bool = False, vertex_weight: Union[float,
  Sequence[float]] = 20, vertex_weight_max: Optional[float] = None,
  vertex_size_max: Optional[float] = None, vertex_label_cex: float = 1.0,
  vertex_label_color: str = "black", edge_weight_max: Optional[float] = None,
  edge_width_max: float = 8.0, alpha_edge: float = 0.6, label_edge: bool =
  False, edge_label_color: str = "black", edge_label_cex: float = 0.8,
  edge_curved: float = 0.2, shape: str = "circle", margin: float = 0.2,
  arrow_width: float = 1.0, arrow_size: float = 0.2, figsize: Tuple[float,
  float] = (6.0, 6.0)) -> Figure
purpose: Circle-layout graph of a square cell-group communication matrix.
description: >
  Direct port of R's netVisual_circle (visualization.R:1991). Takes a
  square weighted adjacency matrix `net` (DataFrame index/columns, or a
  plain ndarray with synthetic string labels) directly rather than an
  AnnData — callers such as netVisual/netVisual_aggregate/
  netVisual_individual/netVisual_diffInteraction extract that matrix from
  `adata.uns['cellchat']['net']` (or a pathway/LR-pair slice of
  `netP`/`net`['prob']) before calling this function. Thresholds `net` to
  its top `top` quantile (zeroing the rest), applies sources_use/
  targets_use/idents_use filtering via a melt-groupby-refill idiom,
  optionally drops isolated (all-zero row+col) cell groups, lays vertices
  out on a unit circle (igraph in_circle(), scaled to zero-mean/unit-SD),
  sizes vertices by `vertex_weight` (scalar or per-group vector, normalised
  against vertex_weight_max/vertex_size_max), and draws each nonzero edge
  as a curved arrow (or a small offset circle for self-loops) whose width
  scales with the edge weight (linearly, or against edge_weight_max when
  weight_scale=True) and whose colour is the source vertex's colour at
  `alpha_edge` opacity. Vertex labels are optionally offset radially by
  vertex_label_cex; edge labels (rounded weight values) are drawn at edge
  midpoints when label_edge=True. Pure function of its `net` input; does
  not read or mutate any AnnData.
parameters:
  - name: net
    type: Union[numpy.ndarray, pandas.DataFrame]
    required: true
    default: null
    description: Square weighted adjacency matrix; DataFrame index/columns (or a provided cell_levels) define the cell-group axis.
  - name: color_use
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Per-cell-group colours. Defaults to scPalette(n); padded/truncated to n if the wrong length is given.
  - name: title_name
    type: Optional[str]
    required: false
    default: null
    description: Plot title.
  - name: sources_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to these source cell groups (names or 1-based indices).
  - name: targets_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to these target cell groups (names or 1-based indices).
  - name: idents_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to those whose source OR target is in this set (names or 1-based indices).
  - name: remove_isolate
    type: bool
    required: false
    default: false
    description: Drop cell groups whose row-sum and column-sum are both zero after filtering.
  - name: top
    type: float
    required: false
    default: 1.0
    description: Keep only edge weights >= the (1-top) quantile of net; the rest are zeroed.
  - name: weight_scale
    type: bool
    required: false
    default: false
    description: Scale edge width by weight/edge_weight_max instead of weight directly.
  - name: vertex_weight
    type: Union[float, Sequence[float]]
    required: false
    default: 20
    description: Per-group vertex size driver (scalar broadcast to all groups, or a per-group sequence, e.g. group cell counts).
  - name: vertex_weight_max
    type: Optional[float]
    required: false
    default: null
    description: Normalisation max for vertex_weight. Defaults to max(vertex_weight).
  - name: vertex_size_max
    type: Optional[float]
    required: false
    default: null
    description: Max vertex marker scale factor. Auto-selected as 5.0 for a uniform vertex_weight, else 15.0.
  - name: vertex_label_cex
    type: float
    required: false
    default: 1.0
    description: Vertex label font-size / radial-offset scale; labels are hidden when <= 0.
  - name: vertex_label_color
    type: str
    required: false
    default: "black"
    description: Vertex label text colour.
  - name: edge_weight_max
    type: Optional[float]
    required: false
    default: null
    description: Normalisation max for edge width when weight_scale=True. Defaults to the max nonzero entry of the (filtered) net.
  - name: edge_width_max
    type: float
    required: false
    default: 8.0
    description: Maximum additional edge linewidth contribution.
  - name: alpha_edge
    type: float
    required: false
    default: 0.6
    description: Edge colour alpha (opacity).
  - name: label_edge
    type: bool
    required: false
    default: false
    description: Draw rounded edge-weight text labels at edge midpoints.
  - name: edge_label_color
    type: str
    required: false
    default: "black"
    description: Edge label text colour.
  - name: edge_label_cex
    type: float
    required: false
    default: 0.8
    description: Edge label font-size scale.
  - name: edge_curved
    type: float
    required: false
    default: 0.2
    description: Bezier curvature factor for edges (0 = straight line).
  - name: shape
    type: str
    required: false
    default: "circle"
    description: Accepted for R API parity; vertex marker shape is not varied by this implementation.
  - name: margin
    type: float
    required: false
    default: 0.2
    description: Fractional axis-limit padding around the vertex layout.
  - name: arrow_width
    type: float
    required: false
    default: 1.0
    description: Arrowhead line-width multiplier.
  - name: arrow_size
    type: float
    required: false
    default: 0.2
    description: Arrowhead size multiplier.
  - name: figsize
    type: Tuple[float, float]
    required: false
    default: (6.0, 6.0)
    description: Matplotlib figure size in inches.
returns: >-
  A new matplotlib.figure.Figure with cell groups on a circular layout,
  curved directed edges sized/coloured by communication weight, and
  optional vertex/edge labels.
mutates: >-
  execution_class=pure_function; reads only the `net` matrix argument (no
  AnnData involved); returns_kind=new_object
requires: []
writes: []
examples:
  - "scc.netVisual_circle(net_count_df, title_name='Number of interactions')"
  - "scc.netVisual_circle(net_df, sources_use=['A'], targets_use=['B', 'C'], remove_isolate=True)"
  - "scc.netVisual_circle(net_df, top=0.3, weight_scale=True, vertex_weight=[5, 10, 15])"
failure_fixes: []
related:
  - spatialcellchat.netVisual
  - spatialcellchat.netVisual_aggregate
  - spatialcellchat.netVisual_individual
  - spatialcellchat.netVisual_diffInteraction
