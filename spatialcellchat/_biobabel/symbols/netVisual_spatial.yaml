id: spatialcellchat.netVisual_spatial
import_path: spatialcellchat.viz_network.netVisual_spatial
kind: function
signature: >-
  netVisual_spatial(net: Union[np.ndarray, pd.DataFrame], coordinates:
  Union[np.ndarray, pd.DataFrame], labels: Sequence, color_use:
  Optional[Sequence[str]] = None, title_name: Optional[str] = None,
  sources_use: Optional[Sequence] = None, targets_use: Optional[Sequence] =
  None, idents_use: Optional[Sequence] = None, remove_isolate: bool = False,
  remove_loop: bool = True, top: float = 1.0, weight_scale: bool = False,
  vertex_weight: Union[float, Sequence[float]] = 20, vertex_weight_max:
  Optional[float] = None, vertex_size_max: Optional[float] = None,
  vertex_label_cex: float = 3.0, vertex_label_color: str = "black",
  edge_weight_max: Optional[float] = None, edge_width_max: float = 8.0,
  edge_curved: float = 0.2, alpha_edge: float = 0.6, arrow_angle: float = 5.0,
  arrow_size: float = 0.2, alpha_image: float = 0.15, point_size: float = 1.0,
  legend_size: float = 3.0, figsize: Tuple[float, float] = (7.0, 7.0)) ->
  Figure
purpose: Overlay a cell-group communication network on the tissue spatial coordinates.
description: >
  Direct port of R's netVisual_spatial (visualization.R:2195). Takes a
  square weighted adjacency matrix `net`, an (N, 2) `coordinates` array
  (already in the caller's plotting convention — the Python port receives
  scanpy/squidpy-convention (x, y) via adata.obsm["spatial"] and performs no
  column swap, unlike R which swaps (imagerow, imagecol) from Seurat's
  GetTissueCoordinates), and a per-cell/per-spot `labels` vector — directly,
  rather than an AnnData. Callers such as netVisual/netVisual_aggregate
  (layout="spatial") extract `net` from `adata.uns['cellchat']['net']` (or a
  netP/net['prob'] pathway/LR-pair slice), pass `adata.obsm['spatial']` as
  `coordinates`, and the resolved ident factor as `labels`. Cell-group
  vertex positions are placed at the centroid of each group's member spots;
  edges, vertex sizing, and weight/top-quantile filtering follow the same
  scheme as netVisual_circle. Draws the tissue background scatter (spot
  points coloured by group, at alpha_image opacity) beneath the network
  overlay. Pure function of its arguments; does not read or mutate any
  AnnData.
parameters:
  - name: net
    type: Union[numpy.ndarray, pandas.DataFrame]
    required: true
    default: null
    description: Square weighted cell-group adjacency matrix.
  - name: coordinates
    type: Union[numpy.ndarray, pandas.DataFrame]
    required: true
    default: null
    description: "(N, 2) per-cell/per-spot (x, y) coordinates; raises ValueError if not exactly 2 columns."
  - name: labels
    type: Sequence
    required: true
    default: null
    description: Per-cell/per-spot group label, length N; used to compute each group's centroid vertex position and to colour the background scatter.
  - name: color_use
    type: Optional[Sequence[str]]
    required: false
    default: null
    description: Per-cell-group colours. Defaults to scPalette(n).
  - name: title_name
    type: Optional[str]
    required: false
    default: null
    description: Plot title.
  - name: sources_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to these source cell groups (names or 1-based indices).
  - name: targets_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to these target cell groups (names or 1-based indices).
  - name: idents_use
    type: Optional[Sequence]
    required: false
    default: null
    description: Restrict edges to those whose source OR target is in this set.
  - name: remove_isolate
    type: bool
    required: false
    default: false
    description: Drop cell groups whose row-sum and column-sum are both zero after filtering.
  - name: remove_loop
    type: bool
    required: false
    default: true
    description: Omit self-loop edges (source == target) from the overlay.
  - name: top
    type: float
    required: false
    default: 1.0
    description: Keep only edge weights >= the (1-top) quantile of net; the rest are zeroed.
  - name: weight_scale
    type: bool
    required: false
    default: false
    description: Scale edge width by weight/edge_weight_max instead of weight directly.
  - name: vertex_weight
    type: Union[float, Sequence[float]]
    required: false
    default: 20
    description: Per-group vertex size driver (scalar, per-group sequence, or a resolved "incoming"/"outgoing" centrality vector when called via netVisual/netVisual_aggregate).
  - name: vertex_weight_max
    type: Optional[float]
    required: false
    default: null
    description: Normalisation max for vertex_weight.
  - name: vertex_size_max
    type: Optional[float]
    required: false
    default: null
    description: Max vertex marker scale factor.
  - name: vertex_label_cex
    type: float
    required: false
    default: 3.0
    description: Vertex label font-size scale.
  - name: vertex_label_color
    type: str
    required: false
    default: "black"
    description: Vertex label text colour.
  - name: edge_weight_max
    type: Optional[float]
    required: false
    default: null
    description: Normalisation max for edge width when weight_scale=True.
  - name: edge_width_max
    type: float
    required: false
    default: 8.0
    description: Maximum additional edge linewidth contribution.
  - name: edge_curved
    type: float
    required: false
    default: 0.2
    description: Bezier curvature factor for edges.
  - name: alpha_edge
    type: float
    required: false
    default: 0.6
    description: Edge colour alpha (opacity).
  - name: arrow_angle
    type: float
    required: false
    default: 5.0
    description: Arrowhead angle, in degrees.
  - name: arrow_size
    type: float
    required: false
    default: 0.2
    description: Arrowhead size multiplier.
  - name: alpha_image
    type: float
    required: false
    default: 0.15
    description: Opacity of the background per-spot scatter.
  - name: point_size
    type: float
    required: false
    default: 1.0
    description: Background spot marker size.
  - name: legend_size
    type: float
    required: false
    default: 3.0
    description: Legend marker scale.
  - name: figsize
    type: Tuple[float, float]
    required: false
    default: (7.0, 7.0)
    description: Matplotlib figure size in inches.
returns: >-
  A new matplotlib.figure.Figure with the tissue spot scatter as background
  and a cell-group communication network (vertices at group centroids, edges
  sized/coloured by weight) overlaid.
mutates: >-
  execution_class=pure_function; reads only its `net`/`coordinates`/`labels`
  arguments (no AnnData involved); returns_kind=new_object
requires: []
writes: []
examples:
  - >-
    scc.netVisual_spatial(net_sum_df, coordinates=adata.obsm["spatial"],
    labels=list(idents), title_name="TNF signaling pathway network")
  - >-
    scc.netVisual_spatial(net_df, coordinates=coords, labels=list(idents),
    sources_use=["A"], point_size=1.0)
failure_fixes:
  - when: "coordinates does not have exactly 2 columns"
    suggest:
      - "Pass an (N, 2) coordinates array/DataFrame."
    explanation: >-
      Raises ValueError("Please check the input 'coordinates' and make sure
      it is a two column matrix.").
related:
  - spatialcellchat.netVisual
  - spatialcellchat.netVisual_aggregate
  - spatialcellchat.netVisual_individual
  - spatialcellchat.netVisual_circle
