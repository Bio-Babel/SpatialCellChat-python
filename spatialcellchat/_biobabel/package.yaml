foundation: []
triggers:
- Inferring or visualizing cell-cell communication / ligand-receptor signaling from
  spatial transcriptomics data (10X Visium, Slide-seqV2, Stereo-seq, MERFISH, ...).
- Need CellChatDB ligand-receptor interaction lookups (human/mouse) or a curated
  L-R database subset.
- Ranking signaling pathways, computing network centrality (senders/receivers),
  or identifying recurring communication "topics" (patterns) across cell groups.
- Need spatial hot-spot (Getis-Ord Gi) or spatial co-occurrence (Lee's statistic)
  analysis tied to inferred communication scores.
not_when:
- The data has no spatial coordinates and no ligand-receptor-signaling question
  (use a general single-cell toolkit like scanpy instead).
- The analysis is single-cell (non-spatial) cell-cell communication inference —
  the R/Python CellChat lineage (non-spatial) is the appropriate tool, not this
  spatial-specific port.
- Only differential expression or clustering is needed, with no communication /
  ligand-receptor component.
